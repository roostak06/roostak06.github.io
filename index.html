<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#246B45">
  <meta name="description" content="روستاک؛ بازار محلی محصولات روستایی. محصولات محلی را ببین و مستقیم با فروشنده ارتباط بگیر.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="روستاک">
  <meta property="og:title" content="روستاک | بازار محصولات محلی و روستایی">
  <meta property="og:description" content="محصولات محلی را پیدا کن و مستقیم با سازنده یا فروشنده ارتباط بگیر.">
  <meta property="og:image" content="./assets/roostak-og.png">
  <meta property="og:image:alt" content="لوگوی روستاک؛ بازار محصولات روستایی">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="روستاک | بازار محصولات محلی و روستایی">
  <meta name="twitter:description" content="محصولات محلی را پیدا کن و مستقیم با سازنده یا فروشنده ارتباط بگیر.">
  <meta name="twitter:image" content="./assets/roostak-og.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="./assets/favicon-48.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=14">
  <title>روستاک | بازار محلی</title>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" id="homeLink" aria-label="صفحه اصلی روستاک">
      <img src="./assets/brand-mark.png" alt="" class="brand-mark" width="38" height="38">
      <span class="brand-word">روستاک</span>
    </a>
    <div class="search-wrap" id="searchWrap">
      <label class="search-box">
        <span class="sr-only">جست‌وجوی محصولات و فروشندگان</span>
        <input id="searchInput" type="search" placeholder="جست‌وجوی محصول یا فروشنده..." autocomplete="off" role="combobox" aria-expanded="false" aria-controls="searchResults" enterkeyhint="search">
        <span aria-hidden="true">⌕</span>
      </label>
      <div class="search-results" id="searchResults" role="listbox" hidden></div>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline install-button" id="installBtn" hidden>نصب</button>
      <button class="account-entry" id="accountEntry"><span id="accountEntryText">ورود</span></button>
    </div>
  </header>

  <div class="back-bar" id="backBar" hidden>
    <button type="button" class="back-home" id="backHomeBtn" aria-label="بازگشت به صفحهٔ اصلی"><span aria-hidden="true">→</span><span>بازگشت به خانه</span></button>
  </div>

  <main id="appMain">
    <section class="hero">
      <p class="eyebrow">از دل روستا، برای همه</p>
      <h1>طعمِ زندگی محلی را <span>پیدا کن.</span></h1>
      <p>محصولات محلی را ببین و مستقیم با سازنده یا فروشنده ارتباط بگیر.</p>
    </section>
    <nav class="category-chips" id="categoryChips" aria-label="دسته‌بندی‌ها"></nav>
    <section class="content-section" id="topProductsSection">
      <div class="section-heading"><div><p class="eyebrow">انتخاب‌های روستاک</p><h2>محصولات برتر</h2></div></div>
      <div class="product-row" id="topProducts"><div class="skeleton-card" aria-hidden="true"><div class="sk sk-img"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div></div><div class="skeleton-card" aria-hidden="true"><div class="sk sk-img"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div></div><div class="skeleton-card" aria-hidden="true"><div class="sk sk-img"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div></div><div class="skeleton-card" aria-hidden="true"><div class="sk sk-img"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div></div></div>
    </section>
    <section class="content-section" id="topSellersSection">
      <div class="section-heading"><div><p class="eyebrow">آدم‌های پشت محصولات</p><h2>فروشنده‌های برتر</h2></div></div>
      <div class="seller-row" id="topSellers"><div class="skeleton-seller" aria-hidden="true"><div class="sk sk-circle"></div><div class="sk sk-line short"></div></div><div class="skeleton-seller" aria-hidden="true"><div class="sk sk-circle"></div><div class="sk sk-line short"></div></div><div class="skeleton-seller" aria-hidden="true"><div class="sk sk-circle"></div><div class="sk sk-line short"></div></div><div class="skeleton-seller" aria-hidden="true"><div class="sk sk-circle"></div><div class="sk sk-line short"></div></div><div class="skeleton-seller" aria-hidden="true"><div class="sk sk-circle"></div><div class="sk sk-line short"></div></div></div>
    </section>
    <div id="categorySections"></div>
  </main>

  <main id="authMain" class="page-main" hidden></main>
  <main id="accountMain" class="page-main" hidden></main>

  <nav class="bottom-nav" aria-label="ناوبری اصلی">
    <button class="nav-item" id="categoriesNav"><span class="nav-icon">☷</span><span>دسته‌ها</span></button>
    <button class="nav-item" id="accountNav"><span class="nav-icon">♙</span><span>حساب من</span></button>
    <button class="nav-item" id="messagesNav"><span class="nav-icon">✉</span><span>پیام‌ها</span><i class="nav-unread" id="messageUnread" hidden></i></button>
    <button class="nav-item" id="settingsNav"><span class="nav-icon">⚙</span><span>تنظیمات</span></button>
  </nav>

  <footer class="site-footer">
    <img src="./assets/brand-mark.png" alt="" width="22" height="22">
    <span>ساخته شده توسط یک شهیدآبادی</span>
  </footer>

  <dialog class="modal" id="appModal">
    <div class="modal-head"><h2 id="modalTitle">تنظیمات</h2><div class="modal-head-actions"><button class="icon-button share-button" id="modalShare" type="button" hidden aria-label="اشتراک‌گذاری محصول" title="اشتراک‌گذاری"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg></button><button class="icon-button" id="modalClose" aria-label="بستن">×</button></div></div>
    <div id="modalBody"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./app.js?v=14"></script>
</body>
</html>
